name: Update API version on PR

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:

      - name: Extract version from PR body
        id: version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          VERSION=$(echo "$PR_BODY" | grep -oE 'Version: v[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}')

          if [ -z "$VERSION" ]; then
            echo "Missing version. Add 'Version: vX.Y.Z' to the PR description."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.1

      - name: Verify PyYAML installation
        run: |
          python -c "import sys; print(sys.executable); import yaml; print(yaml.__version__)"

      - name: Update api_version.yml
        run: |
          python beacon/conf/api_version.py \
            "${{ steps.version.outputs.version }}"

      - name: Commit version update
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add beacon/conf/api_version.yml

          git commit \
            -m "Update API version to ${{ steps.version.outputs.version }}" || exit 0

          git push origin HEAD:${{ github.head_ref }}

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}