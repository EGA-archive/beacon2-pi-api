{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"selfRequestsOnly":false}'>
  <title>Admin UI</title>
  <script type="text/javascript" src="{% static '/adminui/js/htmx.min.js' %}"></script>
  <link rel="stylesheet" href="media/mystyle.css">
</head>

<body>
  <body class="bg-custom-powder-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

      <form method="post" onsubmit="openLoader()">
        {% csrf_token %}
          <div>
            {% for f in form %}
            <p>{{f.help_text|safe}} {{f}} </p>
            {% endfor %}
            <span id="active-label"></span>
          </div>
          <div>
            <button type="submit" class="btn btn-danger mb-3">Save</button>
          </div>
      </form>
</body>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const activateRounding = document.getElementById('id_Activate_Rounding');
    const rounding = document.getElementById('id_Rounding');

    const activateImprecise = document.getElementById('id_Activate_Imprecise');
    const imprecise = document.getElementById('id_Imprecise');

    function updateRounding() {
        rounding.disabled = !activateRounding.checked;
    }

    function updateImprecise() {
        imprecise.disabled = !activateImprecise.checked;
    }

    activateRounding.addEventListener('change', updateRounding);
    activateImprecise.addEventListener('change', updateImprecise);

    updateRounding();
    updateImprecise();
});
</script>
