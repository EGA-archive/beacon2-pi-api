{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"selfRequestsOnly":false}'>
  <title>Admin UI</title>
  <script type="text/javascript" src="{% static '/adminui/js/htmx.min.js' %}"></script>
  <link rel="stylesheet" href="media/mystyle.css">
</head>

<body>
  <body class="bg-custom-powder-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% csrf_token %}
{% for title, form in db_forms.items %}
      <form method="post" onsubmit="openLoader()">
        {{title}}
        
          <div>
            {% for key, value in form.items %}
            <div>{{key}}</div>
            {% if key != 'Password' %}
                <div>               
                    <input type="text" id="id_{{key}}" name="{{key}}" value="{{value}}">
                </div>
            {% else %}
                <div>               
                    <input type="password" id="id_{{key}}" name="{{key}}" value="{{value}}">
                </div>
            {% endif %}
            {% endfor %}
          </div>
          <div>
            <button type="submit" class="btn btn-danger mb-3">Save</button>
          </div>
          <button type="submit" class="btn btn-danger mb-3" name="Test Connection" value="Test {{form.title}} Connection">Test Connection</button>
      </form>
{% endfor %}
</body>
